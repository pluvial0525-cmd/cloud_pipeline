services:

  # =======================================================
  # Redis
  # 로그인 세션 / JWT 저장
  # =======================================================

  redis:
    image: redis:7-alpine

    container_name: ksm_redis

    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - ksm_network


  # =======================================================
  # FastAPI Backend
  # PostgreSQL은 AWS RDS 사용
  # =======================================================

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ksm_backend

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    depends_on:
      - redis

    networks:
      - ksm_network


  # =======================================================
  # React + Nginx
  # =======================================================

  nginx:

    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: ksm_nginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - ksm_network


# =========================================================
# Volumes
# =========================================================

volumes:

  redis_data:


# =========================================================
# Network
# =========================================================

networks:

  ksm_network:

    driver: bridge